<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fergetider</title>
<style>
  :root {
    --bg: #f4f6f8;
    --panel: #ffffff;
    --text: #1b2430;
    --muted: #6b7684;
    --line: #e3e7ec;
    --accent: #0a6cbd;
    --now: #d9480f;
    --past: #a3abb5;
    --cancel: #c92a2a;
    --delay: #d9480f;
    --sky1: #cfe6f7; --sky2: #eef6fc;
    --sea1: #5aa6d6; --sea2: #2f7fb5;
    --land: #7aa36b; --land2: #5e8a52; --mount: #9fb3a6;
    --gap: 12px;
    --heads-h: 0px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10151b; --panel: #18202a; --text: #e6ebf0; --muted: #8d98a5;
      --line: #273240; --accent: #5fb0f0; --now: #ff8a4c; --past: #5b6673;
      --cancel: #ff6b6b; --delay: #ffa94d;
      --sky1: #1d2b3a; --sky2: #26384b; --sea1: #1f4d6e; --sea2: #163a55;
      --land: #3f5e3a; --land2: #334d2f; --mount: #3a4a52;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 10px 16px; display: flex; align-items: baseline; gap: 12px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 1.1rem; margin: 0; }
  .modes { margin-left: auto; display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .modes button {
    border: 0; background: transparent; color: var(--muted); font: inherit; font-size: .8rem;
    padding: 3px 10px; cursor: pointer;
  }
  .modes button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  header .clock { font-variant-numeric: tabular-nums; color: var(--muted); }
  .modes[hidden] { display: none; }
  .modes[hidden] + .clock { margin-left: auto; }
  .cfg {
    align-self: center; border: 1px solid var(--line); border-radius: 8px; background: transparent;
    color: var(--text); line-height: 0; padding: 4px; cursor: pointer;
  }
  .cfg:hover { border-color: var(--accent); color: var(--accent); }

  /* Dialog for valg av samband */
  #pairDialog {
    width: min(560px, calc(100vw - 32px)); max-height: min(80vh, 720px); padding: 0;
    border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text);
    box-shadow: 0 10px 40px rgb(0 0 0 / .3);
  }
  #pairDialog[open] { display: flex; flex-direction: column; }
  #pairDialog::backdrop { background: rgb(0 0 0 / .45); }
  .dlg-head { display: flex; align-items: center; padding: 12px 16px 8px; }
  .dlg-head h2 { margin: 0; font-size: 1.1rem; }
  .dlg-close { margin-left: auto; border: 0; background: transparent; color: var(--muted); font-size: 1.1rem; cursor: pointer; }
  #pairSearch {
    margin: 0 16px 10px; padding: 8px 10px; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px;
  }
  .pairlist { overflow-y: auto; border-top: 1px solid var(--line); }
  .pair {
    display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left;
    padding: 10px 16px; border: 0; border-bottom: 1px solid var(--line); background: transparent;
    color: var(--text); font: inherit; cursor: pointer;
  }
  .pair:hover, .pair:focus-visible { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .pair[aria-current="true"] { background: color-mix(in srgb, var(--accent) 18%, transparent); font-weight: 600; }
  .pair .pc { margin-left: auto; color: var(--muted); font-size: .85rem; white-space: nowrap; }
  header .status { font-size: .85rem; color: var(--muted); }

  /* Bildet øverst og én felles liste med to kolonner under. På store skjermer begrenses bredden. */
  main {
    flex: 1; min-height: 0; position: relative;
    display: grid; grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    row-gap: 8px; padding: 12px 16px; width: 100%; max-width: 980px; margin: 0 auto;
  }
  .map {
    grid-column: 1; grid-row: 1; position: relative;
    /* full bredde, men ikke høyere enn 32 % av skjermen; sentreres når høyden begrenser */
    aspect-ratio: 1774 / 887; width: min(100%, 32vh * 1774 / 887); justify-self: center;
    border-radius: 10px; overflow: hidden; border: 1px solid var(--line);
    /* himmel over og sjø under, slik at bildet kan stå sentrert uten å beskjæres når høyden begrenses */
    background: linear-gradient(var(--sky1) 50%, var(--sea2) 50%);
    display: flex; align-items: center;
  }
  .map[data-mode="simple"] { aspect-ratio: 400 / 260; width: min(100%, 32vh * 400 / 260); }
  /* fotoet: farger fra øverste og nederste kant, dempet som resten av bildet */
  .map[data-mode="fancy"] { background: linear-gradient(#729bc0 50%, #507894 50%); }
  .map .scene { width: 100%; height: 100%; display: block; }
  .map[data-mode="simple"] .scene[data-scene="fancy"],
  .map[data-mode="fancy"] .scene[data-scene="simple"] { display: none; }
  /* Skilt ved fergeleiene i det enkle bildet (samme stil som i fotoet) */
  .sign .board { fill: #fff; stroke: #1b2430; }
  .sign .pole { fill: #f1f3f5; stroke: #1b2430; stroke-width: .4; }
  .sign text { font-weight: 700; font-family: system-ui, sans-serif; fill: #1b2430; text-anchor: middle; }

  .ferry { transition: transform 1s linear; }
  .ferry .wake { display: none; }
  .ferry.moving .wake { display: inline; }
  .ferry.leftward .wake { transform: scaleX(-1); }
  .ferry.moving .bob { animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(2px) rotate(.4deg); } }
  @media (prefers-reduced-motion: reduce) { .ferry { transition: none; } .ferry.moving .bob { animation: none; } }
  .ferrystatus {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 1;
    width: max-content; max-width: calc(100% - 16px); text-align: center;
    background: color-mix(in srgb, var(--panel) 85%, transparent); color: var(--text);
    border-radius: 14px; padding: 4px 12px; font-size: .85rem; font-variant-numeric: tabular-nums;
  }
  .ferrystatus:empty { display: none; }

  /* Klikkbare skilt: usynlige lenkeflater lagt over skiltet i bildet */
  .camlink {
    position: absolute; z-index: 3; border-radius: 4px;
    outline: 2px solid transparent; outline-offset: 1px; transition: outline-color .15s;
  }
  .camlink:hover, .camlink:focus-visible { outline-color: var(--accent); }
  .camlink[hidden] { display: none; }
  .camlink span {
    position: absolute; right: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 10px; line-height: 18px; text-align: center;
    box-shadow: 0 1px 3px rgb(0 0 0 / .3);
  }

  .scroller {
    grid-column: 1; grid-row: 2; min-height: 0;
    overflow-y: auto; overscroll-behavior: contain; position: relative;
    touch-action: pan-y; cursor: grab;
  }
  .scroller.dragging { cursor: grabbing; user-select: none; }

  /* Alle rader bruker de samme to kolonnene */
  .heads, .row, .day, .loader-row {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    column-gap: var(--gap);
  }
  .heads { position: sticky; top: 0; z-index: 3; }
  .heads > div {
    background: var(--panel); border: 1px solid var(--line); border-bottom: 0;
    border-radius: 10px 10px 0 0; padding: 10px 14px 8px;
  }
  .heads h2 { margin: 0; font-size: 1.05rem; }
  .heads .sub { color: var(--muted); font-size: .85rem; }

  .cell {
    background: var(--panel); border-left: 1px solid var(--line); border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 10px; padding: 9px 14px; min-height: 46px;
    font-variant-numeric: tabular-nums;
  }
  .cell .t { font-size: 1.25rem; font-weight: 600; min-width: 3.2em; }
  .cell .old { text-decoration: line-through; color: var(--muted); font-size: .9rem; font-weight: 400; margin-right: 4px; }
  .cell .until { margin-left: auto; font-size: .85rem; color: var(--accent); white-space: nowrap; }
  .cell.past .t, .cell.past .until { color: var(--past); }
  .cell.next { background: color-mix(in srgb, var(--accent) 12%, var(--panel)); }
  .cell.cancelled .t { text-decoration: line-through; color: var(--cancel); }
  .cell .tag { font-size: .75rem; font-weight: 600; color: var(--cancel); }
  .cell .tag.delay { color: var(--delay); }
  .cell .via { color: var(--muted); font-size: .85rem; white-space: nowrap; }
  .stopsbtn {
    display: inline-flex; align-items: center; padding: 3px 4px; margin-left: -4px; cursor: pointer;
    border: 0; border-radius: 6px; background: transparent; color: var(--accent); align-self: center;
  }
  .stopsbtn:hover, .stopsbtn:focus-visible { background: color-mix(in srgb, var(--accent) 15%, transparent); }
  .cell.past .via, .cell.past .stopsbtn { color: var(--past); }
  .stopspop {
    position: fixed; z-index: 10; min-width: 170px; max-width: calc(100vw - 16px); padding: 8px 12px;
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 6px 20px rgb(0 0 0 / .2); font-size: .9rem; font-variant-numeric: tabular-nums;
  }
  .stopspop[hidden] { display: none; }
  .ferryicon { cursor: pointer; transition: transform 1s linear; }
  .ferryicon rect { fill: var(--panel); stroke: var(--accent); stroke-width: 1.5; }
  .ferryicon path { stroke: var(--accent); stroke-width: 1.6; }
  .ferryicon circle { fill: var(--accent); }
  .ferryicon circle.mid { fill: var(--panel); stroke: var(--accent); stroke-width: 1.6; }
  .ferryicon:hover rect { fill: color-mix(in srgb, var(--accent) 18%, var(--panel)); }
  .stopspop .sp-head { color: var(--muted); font-size: .8rem; margin-bottom: 4px; }
  .stopspop .sp-stop span { display: inline-block; width: 3.2em; color: var(--muted); }
  .stopspop .sp-stop.target { font-weight: 700; }
  .cell.none { color: var(--past); }

  .day { position: sticky; top: var(--heads-h); z-index: 2; }
  /* dagoverskriften spenner over begge kolonnene, siden den gjelder begge sider */
  .day > div {
    grid-column: 1 / -1; text-align: center;
    background: var(--panel); color: var(--muted); font-size: .8rem; font-weight: 600;
    padding: 6px 14px; border: 1px solid var(--line); border-top: 0;
    border-bottom: 1px solid var(--line);
  }

  .loader-row > div {
    background: var(--panel); border-left: 1px solid var(--line); border-right: 1px solid var(--line);
    text-align: center; color: var(--muted); font-size: .8rem; padding: 8px;
  }
  .loader-row.bottom > div { border-bottom: 1px solid var(--line); border-radius: 0 0 10px 10px; }

  .nowline { position: relative; height: 0; border-top: 2px solid var(--now); margin-top: -1px; z-index: 1; }
  /* rett under en dagoverskrift: litt luft, så klokkemerket på streken ikke skjules av overskriften */
  .day + .nowline { margin-top: 11px; }
  .nowline span {
    position: absolute; left: 50%; transform: translateX(-50%); top: -10px; background: var(--now); color: #fff;
    font-size: .7rem; font-weight: 700; padding: 1px 6px; border-radius: 8px;
  }

  .tonow {
    position: absolute; z-index: 4; left: 50%; bottom: 24px; transform: translateX(-50%);
    border: 1px solid var(--line); background: var(--panel); color: var(--accent);
    padding: 8px 14px; border-radius: 20px; font: inherit; font-size: .85rem; cursor: pointer;
    box-shadow: 0 2px 8px rgb(0 0 0 / .15);
  }
  .tonow[hidden] { display: none; }
  .msg { grid-column: 1 / -1; padding: 20px 14px; color: var(--muted); text-align: center; background: var(--panel); }
  .msg.error { color: var(--cancel); }


  /* Smal skjerm: mindre luft og tekst */
  @media (max-width: 760px) {
    :root { --gap: 8px; }
    main { padding: 8px; }
    header { flex-wrap: wrap; row-gap: 4px; }
    header .status { display: none; }
    .ferrystatus { bottom: 6px; font-size: .8rem; padding: 2px 10px; }
    .cell { padding: 8px 10px; gap: 6px; flex-wrap: wrap; }
    .cell .t { font-size: 1.1rem; }
    .cell .until { margin-left: 0; }
    .heads > div { padding: 8px 10px 6px; }
    .heads h2 { font-size: .95rem; }
    .day > div { padding: 6px 10px; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">Fergetider</h1>
  <button type="button" class="cfg" id="pairButton" title="Velg samband" aria-label="Velg samband">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
  <span class="status" id="status"></span>
  <div class="modes images" role="group" aria-label="Bilde">
    <button type="button" data-mode="simple" aria-pressed="false">Enkel</button>
    <button type="button" data-mode="fancy" aria-pressed="true">Foto</button>
  </div>
  <span class="clock" id="clock"></span>
</header>

<main>
  <div class="map" id="map" data-mode="fancy">
    <div class="ferrystatus" id="ferryStatus" aria-live="polite"></div>

    <!-- Enkelt bilde: tegnet fjord -->
    <svg class="scene" data-scene="simple" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="var(--sky1)"/><stop offset="1" stop-color="var(--sky2)"/>
        </linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="var(--sea1)"/><stop offset="1" stop-color="var(--sea2)"/>
        </linearGradient>
      </defs>
      <rect width="400" height="260" fill="url(#sky)"/>
      <path d="M0 120 L60 60 L110 100 L170 40 L230 95 L290 55 L350 90 L400 70 L400 130 L0 130Z" fill="var(--mount)"/>
      <rect y="125" width="400" height="135" fill="url(#sea)"/>
      <path d="M0 110 C40 115 70 130 80 170 C85 200 60 240 0 260Z" fill="var(--land)"/>
      <path d="M400 105 C360 112 330 135 322 170 C316 205 345 240 400 260Z" fill="var(--land2)"/>
      <rect x="70" y="172" width="22" height="6" fill="#8a7a66"/>
      <rect x="308" y="172" width="22" height="6" fill="#8a7a66"/>
      <path d="M92 182 Q200 200 308 182" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2" stroke-dasharray="6 6"/>
      <g class="ferries"></g>
      <!-- Skilt ved hvert fergeleie: stolpe fra kaia og en tavle med stedsnavnet -->
      <g class="sign" data-side="l"><rect class="pole"/><rect class="board"/><text></text></g>
      <g class="sign" data-side="r"><rect class="pole"/><rect class="board"/><text></text></g>
      <g class="ferryicons"></g>
    </svg>

    <!-- Foto: dempet bilde, med kaier/skilt og fergen fremhevet i full farge -->
    <svg class="scene" data-scene="fancy" viewBox="0 0 1774 887" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <defs>
        <!-- Demping: beholder fargene, men legger et lett dis over (lavere kontrast, litt lysere) -->
        <filter id="dim" color-interpolation-filters="sRGB">
          <feColorMatrix type="saturate" values="0.8"/>
          <feComponentTransfer>
            <feFuncR type="linear" slope="0.6" intercept="0.22"/>
            <feFuncG type="linear" slope="0.6" intercept="0.22"/>
            <feFuncB type="linear" slope="0.6" intercept="0.22"/>
          </feComponentTransfer>
        </filter>
        <radialGradient id="spotGrad">
          <stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
        </radialGradient>
        <mask id="spot" maskUnits="userSpaceOnUse" x="0" y="0" width="1774" height="887">
          <rect width="1774" height="887" fill="#000"/>
          <ellipse cx="250" cy="420" rx="200" ry="130" fill="url(#spotGrad)"/>   <!-- Misten: skilt og kai -->
          <ellipse cx="1535" cy="435" rx="200" ry="130" fill="url(#spotGrad)"/>  <!-- Festvåg: skilt og kai -->
          <g class="spots"></g>                                                    <!-- følger fergen -->
        </mask>
      </defs>
      <image class="bgimg" width="1774" height="887" filter="url(#dim)"/>
      <image class="bgimg" width="1774" height="887" mask="url(#spot)"/>
      <!-- Skiltene er en del av fotoet; egne, større skilt tegnes oppå dem -->
      <g class="sign" data-side="l"><rect class="board"/><text></text></g>
      <g class="sign" data-side="r"><rect class="board"/><text></text></g>
      <g class="ferries"></g>
      <g class="ferryicons"></g>
    </svg>

    <!-- Fergen og kjølvannet, felles for begge bildene -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <!-- Bilferge sett fra siden, midt på skroget i vannlinjen (0,0) -->
        <g id="ferryShape">
          <ellipse cx="0" cy="5" rx="96" ry="6" fill="#0b2a44" opacity=".3"/>
          <path d="M-88 -6 L88 -6 L80 4 L-80 4Z" fill="#23303d"/>
          <path d="M-94 -26 L94 -26 L88 -6 L-88 -6Z" fill="#f5f6f8" stroke="#1b2430" stroke-width="1"/>
          <path d="M-91 -15 L91 -15 L90 -11 L-90 -11Z" fill="#c92a2a"/>
          <rect x="-74" y="-24" width="148" height="6" fill="#4a5664"/>
          <rect x="-52" y="-44" width="104" height="18" rx="2" fill="#f5f6f8" stroke="#1b2430" stroke-width="1"/>
          <rect x="-46" y="-39" width="92" height="5" fill="#26394d"/>
          <rect x="-20" y="-58" width="40" height="14" rx="2" fill="#f5f6f8" stroke="#1b2430" stroke-width="1"/>
          <rect x="-16" y="-54" width="32" height="4" fill="#26394d"/>
          <rect x="-2" y="-72" width="4" height="14" fill="#c92a2a"/>
        </g>
        <!-- Kjølvann bak fergen når den går mot høyre (speiles ved motsatt retning) -->
        <path id="wakeShape" d="M-86 0 C-140 -2 -200 2 -260 8 C-200 8 -140 8 -86 6Z" fill="#fff" opacity=".55"/>
      </defs>
    </svg>
  </div>

  <div class="scroller" id="scroller">
    <div class="heads" id="heads">
      <div><h2 id="headLeft"></h2><div class="sub" id="subLeft"></div></div>
      <div><h2 id="headRight"></h2><div class="sub" id="subRight"></div></div>
    </div>
    <div id="rows"></div>
  </div>

  <button class="tonow" id="tonow" hidden>↺ Til neste avgang</button>
  <a class="camlink" id="camLeft" target="_blank" rel="noopener" hidden><span aria-hidden="true">📷</span></a>
  <a class="camlink" id="camRight" target="_blank" rel="noopener" hidden><span aria-hidden="true">📷</span></a>
</main>

<!-- Alle stopp på en tur (vises ved klikk på ikonet) -->
<div class="stopspop" id="stopsPop" role="dialog" aria-label="Alle stopp" hidden></div>

<!-- Valg av samband -->
<dialog id="pairDialog" aria-labelledby="pairTitle">
  <div class="dlg-head">
    <h2 id="pairTitle">Velg samband</h2>
    <button type="button" class="dlg-close" id="pairClose" aria-label="Lukk">✕</button>
  </div>
  <input type="search" id="pairSearch" placeholder="Søk etter sted …" autocomplete="off" aria-label="Søk etter sted">
  <div class="pairlist" id="pairList"></div>
</dialog>

<script>
"use strict";

/* ---------- Samband (konfigurasjon) ---------- */
// Standard samband, og det fotoet i bildet viser. Andre samband bruker det enkle bildet.
const DEFAULT_PAIR = {
  left:  { id: "NSR:StopPlace:58672", name: "Misten" },
  right: { id: "NSR:StopPlace:62316", name: "Festvåg" },
};
// Webkamera hos Statens vegvesen ved kjente fergeleier. Kan ikke finnes automatisk,
// fordi Vegvesenets åpne API krever innlogging.
const WEBCAMS = {
  "NSR:StopPlace:58672": "https://www.vegvesen.no/trafikk/vaerveikamera/3001122",   // Misten
  "NSR:StopPlace:62316": "https://www.vegvesen.no/trafikk/vaerveikamera/3001123",   // Festvåg
};
// Bilferger som vises i listen over samband (Entur transportSubmode).
// nationalCarFerry (Hurtigruten/Havila, 35 stopp) er utelatt: det er kystruter, ikke fergesamband.
const CAR_FERRY = new Set(["localCarFerry", "internationalCarFerry", "highSpeedVehicleService"]);
const PAIR_KEY = "fergeweb.samband";

// Fylles ut av resolveConfig() ved oppstart: { left, right, photo }, der left/right er { id, name, webcam }
const CONFIG = { left: null, right: null, photo: false };

const API = "https://api.entur.io/journey-planner/v3/graphql";
const CLIENT_NAME = "softstone42-fergeweb";
const TZ = "Europe/Oslo";
const HOUR = 3600e3;
const INITIAL_BACK = 12 * HOUR;     // hent nok bakover til at det finnes passerte avganger over "nå"
const INITIAL_FORWARD = 30 * HOUR;
const PAGE_FORWARD = 24 * HOUR;     // ved scroll videre fremover
const PAGE_BACK = 12 * HOUR;        // ved scroll bakover
const MAX_BACK = 7 * 24 * HOUR;     // ikke lenger bakover enn dette
const MAX_FORWARD = 60 * 24 * HOUR; // ikke lenger fremover enn dette
const MAX_PAGE = 7 * 24 * HOUR;     // største periode i én henting (når det er glissent med avganger)
const REFRESH_MS = 60e3;            // sanntidsoppdatering
const DELAY_THRESHOLD = 5 * 60e3;   // avvik fra rutetid som vises som "Ny tid"

/* ---------- Entur ---------- */
const QUERY = `
query($id: String!, $start: DateTime!, $range: Int!) {
  stopPlace(id: $id) {
    name
    estimatedCalls(startTime: $start, timeRange: $range, numberOfDepartures: 1000, whiteListedModes: [water],
                   includeCancelledTrips: true, arrivalDeparture: departures) {
      date
      aimedDepartureTime
      expectedDepartureTime
      realtime
      cancellation
      serviceJourney {
        id
        journeyPattern { line { publicCode transportMode transportSubmode } }
      }
      serviceJourneyEstimatedCalls {
        next {
          quay { stopPlace { id name parent { id name } } }
          aimedArrivalTime
          expectedArrivalTime
        }
      }
    }
  }
}`;

async function gql(query, variables = {}) {
  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json", "ET-Client-Name": CLIENT_NAME },
    body: JSON.stringify({ query, variables }),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  if (json.errors) throw new Error(json.errors[0].message);
  return json.data;
}

async function fetchCalls(from, to, startMs, rangeMs) {
  const data = await gql(QUERY, { id: from.id, start: new Date(startMs).toISOString(), range: Math.round(rangeMs / 1000) });
  const calls = data?.stopPlace?.estimatedCalls ?? [];
  return calls.map(c => toDeparture(c, from, to)).filter(Boolean);
}

const isStop = (sp, id) => sp && (sp.id === id || sp.parent?.id === id);

function toDeparture(c, from, to) {
  const line = c.serviceJourney?.journeyPattern?.line;
  // bare bilferger (ikke hurtigbåter og passasjerbåter som går mellom de samme kaiene)
  if (!line || line.transportMode !== "water" || !CAR_FERRY.has(line.transportSubmode)) return null;

  // Må gå til motsatt side etter avgangsstedet
  const arr = (c.serviceJourneyEstimatedCalls?.next ?? []).find(n => isStop(n.quay?.stopPlace, to.id));
  if (!arr) return null;

  const aimed = Date.parse(c.aimedDepartureTime);
  const expected = Date.parse(c.expectedDepartureTime);
  const arrAimed = Date.parse(arr.aimedArrivalTime);
  // Mangler forventet ankomst, antar vi samme forsinkelse som ved avgang
  let arrival = Date.parse(arr.expectedArrivalTime ?? "");
  if (!(arrival > expected)) arrival = arrAimed + (expected - aimed);

  return {
    // samme tur kan gå fra samme kai to ganger (rundtur), så avgangstiden er med i nøkkelen
    key: `${c.serviceJourney.id}|${c.date}|${c.aimedDepartureTime}`,
    aimed, expected, arrival,
    realtime: c.realtime,
    cancelled: c.cancellation,
    code: line.publicCode,
    from: from.name,
    // alle stopp videre på turen, med rutetid
    stops: c.serviceJourneyEstimatedCalls.next.map(n => ({
      name: shortName((n.quay.stopPlace.parent ?? n.quay.stopPlace).name),
      time: Date.parse(n.aimedArrivalTime),
      target: isStop(n.quay.stopPlace, to.id),
    })),
  };
}

/*
 * Lager rader: hver avgang fra venstre side får på samme linje første avgang
 * fra høyre side etter seg (før neste avgang fra venstre) – altså returen.
 * Avganger som ikke får en partner, får en egen rad.
 */
function pairRows(L, R) {
  const rows = [];
  let j = 0;
  for (let i = 0; i < L.length; i++) {
    const l = L[i];
    const nextL = L[i + 1]?.aimed ?? Infinity;
    while (j < R.length && R[j].aimed < l.aimed) rows.push({ l: null, r: R[j++] });
    const r = j < R.length && R[j].aimed < nextL ? R[j++] : null;
    rows.push({ l, r });
  }
  while (j < R.length) rows.push({ l: null, r: R[j++] });
  return rows;
}

/* ---------- Formatering ---------- */
const fmtTime = new Intl.DateTimeFormat("nb-NO", { timeZone: TZ, hour: "2-digit", minute: "2-digit" });
const fmtDayKey = new Intl.DateTimeFormat("sv-SE", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
const fmtDay = new Intl.DateTimeFormat("nb-NO", { timeZone: TZ, weekday: "long", day: "numeric", month: "long" });
const fmtWeekday = new Intl.DateTimeFormat("nb-NO", { timeZone: TZ, weekday: "long" });
const hhmm = ms => fmtTime.format(ms);

function dayLabel(ms) {
  const key = fmtDayKey.format(ms);
  const name = fmtDay.format(ms);
  if (key === fmtDayKey.format(Date.now())) return `I dag – ${name}`;
  if (key === fmtDayKey.format(Date.now() + 24 * HOUR)) return `I morgen – ${name}`;
  if (key === fmtDayKey.format(Date.now() - 24 * HOUR)) return `I går – ${name}`;
  return name.charAt(0).toUpperCase() + name.slice(1);   // bare første bokstav stor
}

function until(ms) {
  const min = Math.round((ms - Date.now()) / 60e3);
  if (min < 0) return "";
  // Avgang på en annen dag enn i dag: vis hvilken dag
  const key = fmtDayKey.format(ms);
  if (key !== fmtDayKey.format(Date.now())) {
    return key === fmtDayKey.format(Date.now() + 24 * HOUR) ? "i morgen" : fmtWeekday.format(ms);
  }
  if (min === 0) return "nå";
  if (min < 60) return `om ${min} min`;
  const h = Math.floor(min / 60), m = min % 60;
  return `om ${h} t ${m} min`;
}

// tekst fra Entur som settes inn i HTML
const esc = t => String(t).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
// ikon for "alle stopp": tre stopp på en linje
const ROUTE_ICON = `<svg viewBox="0 0 24 12" width="22" height="11" aria-hidden="true"><path d="M3 6h18" stroke="currentColor" stroke-width="1.6"/><circle cx="3.5" cy="6" r="2.6" fill="currentColor"/><circle cx="12" cy="6" r="2.6" fill="var(--panel)" stroke="currentColor" stroke-width="1.6"/><circle cx="20.5" cy="6" r="2.6" fill="currentColor"/></svg>`;

const isPast = (d, now) => Math.max(d.expected, d.aimed) < now - 60e3;

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

/* ---------- Tavla: begge sider i én felles liste ---------- */
class Board {
  constructor(left, right) {
    this.left = left; this.right = right;
    this.scroller = document.getElementById("scroller");
    this.rowsEl = document.getElementById("rows");
    this.heads = document.getElementById("heads");
    this.btn = document.getElementById("tonow");
    this.L = new Map(); this.R = new Map();
    this.loadedFrom = 0; this.loadedTo = 0;
    this.backPromise = null; this.fwdPromise = null;   // pågående henting bakover/fremover
    this.backExhausted = false; this.fwdExhausted = false;

    document.getElementById("headLeft").textContent = `Fra ${left.name}`;
    document.getElementById("subLeft").textContent = `til ${right.name}`;
    document.getElementById("headRight").textContent = `Fra ${right.name}`;
    document.getElementById("subRight").textContent = `til ${left.name}`;

    // Dagoverskriftene skal klebe seg rett under kolonneoverskriftene
    new ResizeObserver(() =>
      document.documentElement.style.setProperty("--heads-h", `${this.heads.offsetHeight}px`)
    ).observe(this.heads);

    this.scroller.addEventListener("scroll", () => { this.hideStops(); this.onScroll(); }, { passive: true });
    this.pop = document.getElementById("stopsPop");
    this.rowsEl.addEventListener("click", e => {
      const b = e.target.closest(".stopsbtn");
      if (b) { e.stopPropagation(); this.showStops(b); }
    });
    document.addEventListener("click", e => { if (!this.pop.contains(e.target)) this.hideStops(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") this.hideStops(); });
    this.btn.addEventListener("click", () => this.scrollToNow(true));
    enableMouseDrag(this.scroller);
  }

  async fetchWindow(start, range) {
    const [l, r] = await Promise.all([
      fetchCalls(this.left, this.right, start, range),
      fetchCalls(this.right, this.left, start, range),
    ]);
    return { l, r };
  }

  merge({ l, r }) {
    for (const d of l) this.L.set(d.key, d);
    for (const d of r) this.R.set(d.key, d);
  }

  async init() {
    const now = Date.now();
    this.loadedFrom = now - INITIAL_BACK;
    this.loadedTo = now + INITIAL_FORWARD;
    this.rowsEl.innerHTML = `<div class="row"><div class="msg">Henter avganger …</div></div>`;
    try {
      this.merge(await this.fetchWindow(this.loadedFrom, this.loadedTo - this.loadedFrom));
      this.render();
      this.scrollToNow(false);
      this.fill();   // glisne ruter: hent mer til listen kan scrolles
    } catch (e) {
      this.rowsEl.innerHTML = `<div class="row"><div class="msg error">Kunne ikke hente avganger<br><small>${e.message}</small></div></div>`;
      throw e;
    }
  }

  render() {
    const now = Date.now();
    const byAimed = m => [...m.values()].sort((a, b) => a.aimed - b.aimed);
    const rows = pairRows(byAimed(this.L), byAimed(this.R));
    const frag = document.createDocumentFragment();

    const loaderRow = (cls, text) => {
      const r = el("div", `loader-row ${cls}`);
      r.append(el("div", null, text), el("div", null, text));
      return r;
    };
    frag.append(loaderRow("top", this.backExhausted ? "Ingen tidligere avganger" : "Dra ned for tidligere avganger"));

    if (!rows.length) {
      const r = el("div", "row");
      r.append(el("div", "msg", "Ingen avganger i perioden"));
      frag.append(r);
    }

    const nowLine = () => el("div", "nowline", `<span>${hhmm(now)}</span>`);
    const nextKey = { l: null, r: null };
    for (const side of ["l", "r"]) {
      nextKey[side] = rows.map(x => x[side]).find(d => d && !d.cancelled && !isPast(d, now))?.key ?? null;
    }

    let lastDay = null, nowPlaced = false;
    for (const { l, r } of rows) {
      const t = (l ?? r).aimed;
      const day = fmtDayKey.format(t);
      if (day !== lastDay) {
        const h = el("div", "day");
        h.append(el("div", null, dayLabel(t)));
        frag.append(h);
        lastDay = day;
      }
      const anyFuture = [l, r].some(d => d && !isPast(d, now));
      if (anyFuture && !nowPlaced) { frag.append(nowLine()); nowPlaced = true; }

      const row = el("div", "row");
      // begge avgangene på raden: sammenkoblingen kan endre seg når flere avganger hentes
      row.dataset.key = [l?.key, r?.key].filter(Boolean).join(" ");
      row.append(this.cell(l, now, nextKey.l), this.cell(r, now, nextKey.r));
      frag.append(row);
    }
    if (rows.length && !nowPlaced) frag.append(nowLine());

    frag.append(loaderRow("bottom", this.fwdExhausted ? "Ingen flere avganger" : "Dra opp for flere avganger"));
    this.rowsEl.replaceChildren(frag);
  }

  cell(d, now, nextKey) {
    if (!d) return el("div", "cell none", "–");
    const past = isPast(d, now);
    const c = el("div", "cell");
    if (past) c.classList.add("past");
    if (d.cancelled) c.classList.add("cancelled");
    if (d.key === nextKey) c.classList.add("next");

    // Passerte avganger vises med rutetid; kommende med eventuell ny tid fra sanntid
    const delayed = !past && Math.abs(d.expected - d.aimed) >= DELAY_THRESHOLD;
    const shown = delayed ? d.expected : d.aimed;
    const tag = d.cancelled ? `<span class="tag">Innstilt</span>`
              : delayed ? `<span class="tag delay">Ny tid</span>` : "";
    // flere stopp: vis første stopp og et ikon som viser alle stopp
    const multi = d.stops.length > 1;
    const all = multi ? d.stops.map(x => `${hhmm(x.time)} ${x.name}`).join(", ") : "";
    const via = multi
      ? `<span class="via">→ ${esc(d.stops[0].name)}</span>` +
        `<button type="button" class="stopsbtn" data-key="${esc(d.key)}" title="${esc(all)}" aria-label="Alle stopp: ${esc(all)}">${ROUTE_ICON}</button>`
      : "";
    c.innerHTML =
      `<span class="t">${delayed ? `<span class="old">${hhmm(d.aimed)}</span>` : ""}${hhmm(shown)}</span>` +
      tag + via +
      `<span class="until">${past || d.cancelled ? "" : until(shown)}</span>`;
    return c;
  }

  /* Viser alle stopp på turen i en liten boks under ikonet (i listen eller over fergen) */
  showStops(btn) {
    const d = this.L.get(btn.dataset.key) ?? this.R.get(btn.dataset.key);
    if (!d?.stops.length) return;
    if (!this.pop.hidden && this.pop.dataset.key === d.key) { this.hideStops(); return; }
    this.pop.dataset.key = d.key;
    this.pop.innerHTML =
      `<div class="sp-head">Fra ${esc(d.from)} ${hhmm(d.aimed)}</div>` +
      d.stops.map(x => `<div class="sp-stop${x.target ? " target" : ""}"><span>${hhmm(x.time)}</span>${esc(x.name)}</div>`).join("");
    this.pop.hidden = false;
    const r = btn.getBoundingClientRect(), w = this.pop.offsetWidth, h = this.pop.offsetHeight;
    const left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8);
    const below = r.bottom + 6 + h < innerHeight;
    Object.assign(this.pop.style, { left: `${left}px`, top: `${below ? r.bottom + 6 : r.top - h - 6}px` });
  }

  hideStops() { if (this.pop && !this.pop.hidden) this.pop.hidden = true; }

  /* Høyden på det som klistrer seg øverst (kolonneoverskrift + dagoverskrift) */
  stickyHeight() {
    return this.heads.offsetHeight + (this.rowsEl.querySelector(".day")?.offsetHeight ?? 0);
  }

  /* Re-render uten at innholdet hopper: hold første synlige rad på samme plass.
     Raden finnes igjen via en av avgangene på den, siden en avgang kan ha fått ny partner. */
  renderKeepingPosition() {
    const anchor = this.firstVisibleRow();
    const offset = anchor ? anchor.getBoundingClientRect().top : 0;
    const keys = anchor?.dataset.key.split(" ") ?? [];
    this.render();
    for (const key of keys) {
      const again = this.rowsEl.querySelector(`.row[data-key~="${CSS.escape(key)}"]`);
      if (again) { this.scroller.scrollTop += again.getBoundingClientRect().top - offset; break; }
    }
    this.updateNowButton();
  }

  firstVisibleRow() {
    const top = this.scroller.getBoundingClientRect().top + this.stickyHeight();
    for (const r of this.rowsEl.querySelectorAll(".row[data-key]")) {
      if (r.getBoundingClientRect().bottom > top + 10) return r;
    }
    return null;
  }

  scrollToNow(smooth) {
    const nowline = this.rowsEl.querySelector(".nowline");
    if (!nowline) return;
    // "nå"-streken rett under overskriftene, med én passert rad over hvis den er på samme dag.
    // Starter neste avgang en ny dag, står dagoverskriften for den nye dagen øverst.
    let top = nowline.offsetTop - this.stickyHeight();
    const prev = nowline.previousElementSibling;
    if (prev?.matches(".row[data-key]")) top -= prev.offsetHeight;
    else top -= 11;   // ny dag: streken har 11 px luft under dagoverskriften (se .day + .nowline)
    this.scroller.scrollTo({ top, behavior: smooth ? "smooth" : "auto" });
  }

  onScroll() {
    this.fill();
    this.updateNowButton();
  }

  /*
   * Hent mer til listen er lang nok til å scrolle i begge retninger. Uten dette kan en glissen rute
   * (f.eks. Ørnes–Bolga) få så få avganger at listen ikke kan scrolles, og da kommer det aldri mer.
   * Perioder uten avganger gir større og større hentinger, opp til MAX_PAGE.
   */
  async fill() {
    if (this.filling) return;
    this.filling = true;
    let fwdRange = PAGE_FORWARD, backRange = PAGE_BACK;
    try {
      for (let i = 0; i < 30; i++) {
        const s = this.scroller;
        const needFwd = !this.fwdExhausted && s.scrollTop + s.clientHeight > s.scrollHeight - 300;
        const needBack = !this.backExhausted && s.scrollTop < 150;
        if (!needFwd && !needBack) break;
        const before = this.L.size + this.R.size;
        await Promise.all([needFwd && this.loadForward(fwdRange), needBack && this.loadBack(backRange)]);
        if (this.L.size + this.R.size === before) {   // ingenting nytt: hent lengre neste gang
          if (needFwd) fwdRange = Math.min(fwdRange * 2, MAX_PAGE);
          if (needBack) backRange = Math.min(backRange * 2, MAX_PAGE);
        }
      }
    } catch (e) { setStatus(`Feil: ${e.message}`); }
    finally { this.filling = false; }
  }

  updateNowButton() {
    const nl = this.rowsEl.querySelector(".nowline");
    if (!nl) { this.btn.hidden = true; return; }
    const r = nl.getBoundingClientRect(), s = this.scroller.getBoundingClientRect();
    this.btn.hidden = r.top >= s.top + this.stickyHeight() - 2 && r.top < s.bottom;   // litt slingringsmonn i kanten
  }

  loadForward(range = PAGE_FORWARD) {
    if (this.fwdExhausted) return Promise.resolve();
    return this.fwdPromise ??= (async () => {
      const start = this.loadedTo;
      const end = Math.min(start + range, Date.now() + MAX_FORWARD);
      this.merge(await this.fetchWindow(start, end - start));
      this.loadedTo = end;
      if (end >= Date.now() + MAX_FORWARD) this.fwdExhausted = true;
      this.renderKeepingPosition();
    })().finally(() => { this.fwdPromise = null; });
  }

  loadBack(range = PAGE_BACK) {
    if (this.backExhausted) return Promise.resolve();
    return this.backPromise ??= (async () => {
      const start = Math.max(this.loadedFrom - range, Date.now() - MAX_BACK);
      this.merge(await this.fetchWindow(start, this.loadedFrom - start));
      this.loadedFrom = start;
      if (start <= Date.now() - MAX_BACK) this.backExhausted = true;
      this.renderKeepingPosition();
    })().finally(() => { this.backPromise = null; });
  }

  /* Hent sanntid for perioden rundt nå på nytt */
  async refresh() {
    const start = Date.now() - HOUR;
    const range = 6 * HOUR;
    const fresh = await this.fetchWindow(start, range);
    // fjern gamle innslag i vinduet som ikke lenger finnes (f.eks. endret avgang)
    for (const [map, list] of [[this.L, fresh.l], [this.R, fresh.r]]) {
      const keys = new Set(list.map(d => d.key));
      for (const [k, d] of map) {
        if (d.aimed >= start + HOUR && d.aimed < start + range - HOUR && !keys.has(k)) map.delete(k);
      }
    }
    this.merge(fresh);
    this.renderKeepingPosition();
  }
}

/* ---------- Fergen på kartet ---------- */
/*
 * Posisjonen beregnes ut fra forventet avgang og forventet ankomst for turen som
 * pågår nå: fergen flyttes jevnt langs ruten mellom fergeleiene. Entur gir ingen
 * posisjonsdata, så dette er et anslag. Går ingen tur nå, ligger fergen ved kaien
 * den sist ankom.
 */
// Fergeleienes plassering i hvert bilde: fergens midtpunkt i vannlinjen ved kai.
// "fancy" bruker koordinater i bare_fjorden_navn.webp (1774 × 887).
const SCENES = {
  simple: {
    dock: { l: { x: 112, y: 180 }, r: { x: 288, y: 180 } },
    ctrl: { x: 200, y: 198 },   // kontrollpunkt for buen over fjorden
    size: 0.22,                  // fergens størrelse i dette bildet
    midScale: 0,                 // ekstra størrelse midt i fjorden (perspektiv)
  },
  fancy: {
    dock: { l: { x: 454, y: 498 }, r: { x: 1326, y: 510 } },
    ctrl: { x: 890, y: 590 },   // buen går litt nærmere betrakteren midt i fjorden
    size: 1,
    midScale: 0.12,
  },
};

function pointOnRoute(scene, t) {  // t = 0 ved venstre kai, 1 ved høyre
  const { dock: { l, r }, ctrl } = scene;
  const u = 1 - t;
  return {
    x: u * u * l.x + 2 * u * t * ctrl.x + t * t * r.x,
    y: u * u * l.y + 2 * u * t * ctrl.y + t * t * r.y,
    scale: scene.size * (1 + scene.midScale * Math.sin(Math.PI * t)),
  };
}

/* " via Vassdalsvik" når turen går innom andre kaier før motsatt side */
function viaText(d) {
  const i = d.stops.findIndex(x => x.target);
  const via = d.stops.slice(0, i).map(x => x.name);
  return via.length ? ` via ${via.join(", ")}` : "";
}

/* Hvor fergen(e) er nå, som andel av ruten (t) – uavhengig av hvilket bilde som vises */
function ferryState(board, now) {
  const trips = [
    ...[...board.L.values()].map(d => ({ ...d, from: "l", to: "r" })),
    ...[...board.R.values()].map(d => ({ ...d, from: "r", to: "l" })),
  ].filter(d => !d.cancelled).sort((a, b) => a.expected - b.expected);
  const name = s => (s === "l" ? board.left : board.right).name;

  const active = trips.filter(d => d.expected <= now && now < d.arrival);
  if (active.length) {
    return {
      ferries: active.map(d => {
        const p = (now - d.expected) / (d.arrival - d.expected);
        return { t: d.from === "l" ? p : 1 - p, moving: true, leftward: d.from === "r", trip: d };
      }),
      text: `Underveis til ${name(active[0].to)}${viaText(active[0])} · ankomst ca. ${hhmm(active[0].arrival)}`,
    };
  }

  const last = trips.filter(d => d.arrival <= now).reduce((a, d) => (!a || d.arrival > a.arrival ? d : a), null);
  const side = last?.to ?? trips.find(d => d.expected > now)?.from;
  if (!side) return { ferries: [], text: "" };
  const next = trips.find(d => d.from === side && d.expected > now);
  return {
    ferries: [{ t: side === "l" ? 0 : 1, moving: false, leftward: false }],
    text: `Ved ${name(side)}` + (next ? ` · neste avgang ${hhmm(next.expected)}` : ""),
  };
}

const SVG_NS = "http://www.w3.org/2000/svg";

function makeFerry() {
  const g = document.createElementNS(SVG_NS, "g");
  g.classList.add("ferry");
  for (const [cls, ref] of [["wake", "#wakeShape"], ["bob", "#ferryShape"]]) {
    const inner = document.createElementNS(SVG_NS, "g");
    inner.classList.add(cls);
    const use = document.createElementNS(SVG_NS, "use");
    use.setAttribute("href", ref);
    inner.append(use);
    g.append(inner);
  }
  return g;
}

function makeSpot() {
  const e = document.createElementNS(SVG_NS, "ellipse");
  e.setAttribute("fill", "url(#spotGrad)");
  e.classList.add("ferry");   // samme jevne bevegelse som fergen
  e.setAttribute("rx", 150); e.setAttribute("ry", 95);
  return e;
}

/* Sørg for at gruppen har akkurat n barn */
function syncChildren(g, n, make) {
  while (g.children.length > n) g.lastChild.remove();
  while (g.children.length < n) g.append(make());
}

/* Ruteikon over fergen når turen har flere stopp; samme hint og boks som ikonet i listen */
function makeFerryIcon(board) {
  const g = document.createElementNS(SVG_NS, "g");
  g.classList.add("ferryicon");
  g.innerHTML = `<title></title><rect x="-17" y="-11" width="34" height="22" rx="11"/>
    <path d="M-9 0h18"/><circle cx="-8.5" r="2.6"/><circle class="mid" r="2.6"/><circle cx="8.5" r="2.6"/>`;
  g.addEventListener("click", e => { e.stopPropagation(); board.showStops(g); });
  return g;
}

function updateFerry(board) {
  const { ferries, text } = ferryState(board, Date.now());
  for (const svg of document.querySelectorAll(".map .scene")) {
    const scene = SCENES[svg.dataset.scene];
    // skjermpiksler per bildeenhet, så ikonet får samme størrelse på skjermen i begge bilder
    const box = svg.getBoundingClientRect();
    const [, , vbW, vbH] = svg.getAttribute("viewBox").split(" ").map(Number);
    const px = box.width ? Math.min(box.width / vbW, box.height / vbH) : 1;
    const icons = svg.querySelector(".ferryicons");
    syncChildren(icons, ferries.length, () => makeFerryIcon(board));
    const g = svg.querySelector(".ferries");
    syncChildren(g, ferries.length, makeFerry);
    const spots = svg.querySelector(".spots");
    if (spots) syncChildren(spots, ferries.length, makeSpot);

    ferries.forEach((f, i) => {
      const p = pointOnRoute(scene, f.t);
      const el = g.children[i];
      el.style.transform = `translate(${p.x}px, ${p.y}px) scale(${p.scale})`;
      el.classList.toggle("moving", f.moving);
      el.classList.toggle("leftward", f.leftward);
      // lyskjeglen ligger midt på fergen, litt over vannlinjen
      if (spots) spots.children[i].style.transform = `translate(${p.x}px, ${p.y - 25 * p.scale}px) scale(${p.scale})`;

      // ruteikon over masten, bare på turer med flere stopp
      const icon = icons.children[i], d = f.trip;
      const multi = d?.stops.length > 1;
      icon.style.display = multi ? "" : "none";
      if (!multi) return;
      const k = 1 / px;   // ikonet tegnes i skjermpiksler
      icon.style.transform = `translate(${p.x}px, ${p.y - 76 * p.scale - 16 * k}px) scale(${k})`;
      if (icon.dataset.key !== d.key) {
        icon.dataset.key = d.key;
        icon.querySelector("title").textContent = "Alle stopp: " + d.stops.map(x => `${hhmm(x.time)} ${x.name}`).join(", ");
      }
    });
  }
  document.getElementById("ferryStatus").textContent = text;
}

/* ---------- Skilt ved fergeleiene ---------- */
/*
 * Skiltene tegnes fra kode med stor skrift, slik at det er lett å se hva som er på hver side.
 * Tavla tilpasses navnet og hvor stort bildet vises. I fotoet tegnes de over skiltene i bildet.
 * x/bottom: midt under tavla, i bildets koordinater. poleTo: der stolpen møter kaia.
 * minFont: minste skriftstørrelse i bildets koordinater.
 */
const SIGNS = {
  simple: { width: 400, minFont: 14, l: { x: 81, bottom: 141, poleTo: 172 }, r: { x: 319, bottom: 141, poleTo: 172 } },
  fancy:  { width: 1774, minFont: 40, l: { x: 257, bottom: 377 }, r: { x: 1607, bottom: 382 } },
};
const SIGN_PX = 18;   // ønsket tekststørrelse på skjermen

const measureCtx = document.createElement("canvas").getContext("2d");
function textWidth(text, font) {
  measureCtx.font = `700 ${font}px system-ui, sans-serif`;
  return measureCtx.measureText(text).width;
}

function drawSigns() {
  const names = { l: CONFIG.left.name, r: CONFIG.right.name };
  for (const svg of document.querySelectorAll(".map .scene")) {
    const cfg = SIGNS[svg.dataset.scene];
    const box = svg.getBoundingClientRect();
    if (!box.width) continue;   // skjult bilde: tegnes når det vises
    const [, , vbW, vbH] = svg.getAttribute("viewBox").split(" ").map(Number);
    const scale = Math.min(box.width / vbW, box.height / vbH);   // skjermpiksler per bildeenhet

    for (const side of ["l", "r"]) {
      const g = svg.querySelector(`.sign[data-side="${side}"]`);
      if (!g) continue;
      const name = names[side];
      let font = Math.max(cfg.minFont, SIGN_PX / scale);
      // tavlene må ikke bli så brede at de møtes på midten
      const maxW = cfg.width * 0.47;
      const w0 = textWidth(name, font) + font * 1.1;
      if (w0 > maxW) font *= maxW / w0;

      const w = textWidth(name, font) + font * 1.1, h = font * 1.55;
      const a = cfg[side];
      const margin = cfg.width * 0.01;
      const cx = Math.min(Math.max(a.x, w / 2 + margin), cfg.width - w / 2 - margin);

      const board = g.querySelector(".board");
      Object.entries({ x: cx - w / 2, y: a.bottom - h, width: w, height: h, rx: font * 0.25 })
        .forEach(([k, v]) => board.setAttribute(k, v));
      board.style.strokeWidth = font * 0.07;
      const text = g.querySelector("text");
      text.textContent = name;
      text.setAttribute("x", cx);
      text.setAttribute("y", a.bottom - h * 0.3);
      text.style.fontSize = `${font}px`;
      const pole = g.querySelector(".pole");
      if (pole) Object.entries({ x: a.x - 1, y: a.bottom, width: 2, height: a.poleTo - a.bottom })
        .forEach(([k, v]) => pole.setAttribute(k, v));
    }
  }
}

function refreshSigns() {
  drawSigns();
  placeCamLinks();
}

/* ---------- Valg av bilde (Enkel / Foto), huskes i nettleseren ---------- */
const MODE_KEY = "fergeweb.bilde";

/* ---------- Webkamera-lenker på skiltene ---------- */
/* Lenkene plasseres over skiltet i bildet som vises nå */
function placeCamLinks() {
  const main = document.querySelector("main").getBoundingClientRect();
  const mode = document.getElementById("map").dataset.mode;
  for (const [side, place, linkId] of [
    ["l", CONFIG.left, "camLeft"],
    ["r", CONFIG.right, "camRight"],
  ]) {
    const a = document.getElementById(linkId);
    a.hidden = !place.webcam;
    if (!place.webcam) continue;
    a.href = place.webcam;
    a.title = `Webkamera ved ${place.name} fergeleie (Statens vegvesen)`;
    a.setAttribute("aria-label", a.title);
    const target = document.querySelector(`.scene[data-scene="${mode}"] .sign[data-side="${side}"] .board`);
    const r = target.getBoundingClientRect();
    Object.assign(a.style, {
      left: `${r.left - main.left}px`, top: `${r.top - main.top}px`,
      width: `${r.width}px`, height: `${r.height}px`,
    });
  }
}

function setMode(mode, remember = true) {
  if (!SCENES[mode]) mode = "fancy";
  document.getElementById("map").dataset.mode = mode;
  for (const b of document.querySelectorAll(".images button")) b.setAttribute("aria-pressed", b.dataset.mode === mode);
  if (remember) try { localStorage.setItem(MODE_KEY, mode); } catch {}
  refreshSigns();
}

function initMode() {
  let saved = null;
  try { saved = localStorage.getItem(MODE_KEY); } catch {}
  // fotoet viser bare standard-sambandet; andre samband får alltid det enkle bildet
  document.querySelector(".images").hidden = !CONFIG.photo;
  if (!CONFIG.photo) { setMode("simple", false); return; }
  setMode(saved ?? "fancy");
  for (const b of document.querySelectorAll(".images button")) b.addEventListener("click", () => setMode(b.dataset.mode));
}


/* Gjør det mulig å "dra" i listen med mus på PC (touch fungerer allerede) */
function enableMouseDrag(el) {
  let startY = 0, startTop = 0, down = false, moved = false;
  el.addEventListener("pointerdown", e => {
    if (e.pointerType !== "mouse" || e.button !== 0) return;
    down = true; moved = false; startY = e.clientY; startTop = el.scrollTop;
  });
  window.addEventListener("pointermove", e => {
    if (!down) return;
    const dy = e.clientY - startY;
    if (!moved && Math.abs(dy) > 4) { moved = true; el.classList.add("dragging"); }
    if (moved) el.scrollTop = startTop - dy;
  });
  window.addEventListener("pointerup", () => { down = false; el.classList.remove("dragging"); });
}

/* ---------- Valg av samband ---------- */
// "Misten ferjekai" -> "Misten"
const shortName = n => n.replace(/\s+(ferjekai|fergekai|ferjeleie|fergeleie|ferjeterminal|fergeterminal|hurtigbåtkai|kai|brygge)$/i, "");
const byName = (a, b) => a.name.localeCompare(b.name, "nb");
// Stedet som kommer senest i alfabetet, står til venstre
const orderPair = (a, b) => (byName(a, b) >= 0 ? [a, b] : [b, a]);
const nsrNum = id => id.replace("NSR:StopPlace:", "");

/* Finn samband ved oppstart: lenke (?samband=58672-62316), ellers lagret i nettleseren, ellers standard */
async function resolveConfig() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(PAIR_KEY)); } catch {}
  const m = new URLSearchParams(location.search).get("samband")?.match(/^(\d+)-(\d+)$/);
  const ids = m ? [`NSR:StopPlace:${m[1]}`, `NSR:StopPlace:${m[2]}`]
            : saved?.left && saved?.right ? [saved.left.id, saved.right.id]
            : [DEFAULT_PAIR.left.id, DEFAULT_PAIR.right.id];

  // navn vi allerede kjenner; ellers hentes de fra Entur
  const known = new Map([DEFAULT_PAIR.left, DEFAULT_PAIR.right, saved?.left, saved?.right].filter(Boolean).map(p => [p.id, p]));
  let places = ids.map(id => known.get(id));
  if (places.some(p => !p)) {
    const d = await gql("query($a: String!, $b: String!) { a: stopPlace(id: $a) { id name } b: stopPlace(id: $b) { id name } }",
                        { a: ids[0], b: ids[1] });
    if (!d.a || !d.b) throw new Error("Ukjent fergeleie i lenken");
    places = [d.a, d.b].map(p => ({ id: p.id, name: shortName(p.name) }));
  }
  const [left, right] = orderPair(...places);
  CONFIG.left = { ...left, webcam: WEBCAMS[left.id] ?? null };
  CONFIG.right = { ...right, webcam: WEBCAMS[right.id] ?? null };
  CONFIG.photo = left.id === DEFAULT_PAIR.left.id && right.id === DEFAULT_PAIR.right.id;

  try { localStorage.setItem(PAIR_KEY, JSON.stringify({ left, right })); } catch {}
  // adressen viser valgt samband, så den kan deles eller bokmerkes
  history.replaceState(null, "", `?samband=${nsrNum(left.id)}-${nsrNum(right.id)}`);
}

/* Alle par av fergeleier som en bilferge går mellom (også med stopp underveis), sortert etter navnet til venstre */
let pairsPromise = null;
function loadPairs() {
  pairsPromise ??= gql(`{ lines(transportModes: [water]) { publicCode transportSubmode
      journeyPatterns { quays { stopPlace { id name parent { id name } } } } } }`).then(d => {
    const pairs = new Map();
    for (const line of d.lines) {
      if (!CAR_FERRY.has(line.transportSubmode)) continue;
      for (const jp of line.journeyPatterns) {
        const stops = jp.quays.map(q => q.stopPlace.parent ?? q.stopPlace).map(sp => ({ id: sp.id, name: shortName(sp.name) }));
        // alle par der fergen går fra det ene til det andre på samme tur
        for (let a = 0; a < stops.length; a++) for (let b = a + 1; b < stops.length; b++) {
          if (stops[a].id === stops[b].id) continue;
          const [left, right] = orderPair(stops[a], stops[b]);
          const key = `${left.id}|${right.id}`;
          const pair = pairs.get(key) ?? { left, right, codes: new Set() };
          if (line.publicCode) pair.codes.add(line.publicCode);
          pairs.set(key, pair);
        }
      }
    }
    return [...pairs.values()].sort((a, b) => byName(a.left, b.left) || byName(a.right, b.right));
  }).catch(e => { pairsPromise = null; throw e; });
  return pairsPromise;
}

function choosePair(pair) {
  try { localStorage.setItem(PAIR_KEY, JSON.stringify({ left: pair.left, right: pair.right })); } catch {}
  // last siden på nytt med nytt samband, så alt starter rent
  location.search = `?samband=${nsrNum(pair.left.id)}-${nsrNum(pair.right.id)}`;
}

function initPairDialog() {
  const dlg = document.getElementById("pairDialog");
  const search = document.getElementById("pairSearch");
  const list = document.getElementById("pairList");
  let pairs = [];

  const render = () => {
    const q = search.value.trim().toLocaleLowerCase("nb");
    const shown = pairs.filter(p => !q || `${p.left.name} ${p.right.name}`.toLocaleLowerCase("nb").includes(q));
    list.replaceChildren(...shown.map(p => {
      const b = el("button", "pair");
      b.type = "button";
      const name = el("span", "pn"), code = el("span", "pc");
      name.textContent = `${p.left.name} – ${p.right.name}`;   // tekst fra Entur settes som tekst, ikke HTML
      code.textContent = [...p.codes].join(", ");
      b.append(name, code);
      if (p.left.id === CONFIG.left.id && p.right.id === CONFIG.right.id) b.setAttribute("aria-current", "true");
      b.addEventListener("click", () => choosePair(p));
      return b;
    }));
    if (!shown.length) list.append(el("div", "msg", pairs.length ? "Ingen treff" : ""));
  };

  document.getElementById("pairButton").addEventListener("click", async () => {
    dlg.showModal();
    search.value = "";
    if (pairs.length) { render(); list.querySelector("[aria-current]")?.scrollIntoView({ block: "center" }); return; }
    list.replaceChildren(el("div", "msg", "Henter samband …"));
    try {
      pairs = await loadPairs();
      render();
      list.querySelector("[aria-current]")?.scrollIntoView({ block: "center" });
    } catch (e) {
      list.replaceChildren(el("div", "msg error", "Kunne ikke hente samband"));
    }
  });
  search.addEventListener("input", render);
  // begynner man å skrive et annet sted i dialogen, fortsetter det i søkefeltet
  dlg.addEventListener("keydown", e => {
    if (e.target === search || e.ctrlKey || e.metaKey || e.altKey) return;
    const typed = e.key.length === 1 && e.key !== " ";
    if (!typed && e.key !== "Backspace") return;
    e.preventDefault();
    search.focus();
    search.value = typed ? search.value + e.key : search.value.slice(0, -1);
    search.setSelectionRange(search.value.length, search.value.length);
    render();
  });
  document.getElementById("pairClose").addEventListener("click", () => dlg.close());
  // klikk utenfor dialogen lukker den
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
}

/* ---------- Oppstart ---------- */
const statusEl = document.getElementById("status");
function setStatus(t) { statusEl.textContent = t; }

const fmtClock = new Intl.DateTimeFormat("nb-NO", { timeZone: TZ, hour: "2-digit", minute: "2-digit", second: "2-digit" });
function tickClock() { document.getElementById("clock").textContent = fmtClock.format(Date.now()); }

function setTitle(codes = []) {
  const { left, right } = CONFIG;
  document.title = `Ferge ${left.name} – ${right.name}`;
  document.getElementById("title").textContent =
    `${left.name} – ${right.name}${codes.length ? ` (${codes.join(", ")})` : ""}`;
}

async function main() {
  let note = "";   // vises i statusfeltet hvis lenken ikke kunne brukes
  try { await resolveConfig(); }
  catch (e) {
    // ugyldig lenke e.l.: bruk standard samband
    try { localStorage.removeItem(PAIR_KEY); } catch {}
    Object.assign(CONFIG, { left: { ...DEFAULT_PAIR.left }, right: { ...DEFAULT_PAIR.right }, photo: true });
    CONFIG.left.webcam = WEBCAMS[CONFIG.left.id]; CONFIG.right.webcam = WEBCAMS[CONFIG.right.id];
    history.replaceState(null, "", location.pathname);
    note = "Fant ikke sambandet i lenken, viser standard";
  }
  const { left, right } = CONFIG;
  setTitle();
  initPairDialog();

  new ResizeObserver(refreshSigns).observe(document.getElementById("map"));
  window.addEventListener("resize", refreshSigns);
  initMode();

  const board = new Board(left, right);

  tickClock();
  setInterval(tickClock, 1000);

  try {
    await board.init();
    setStatus(note || `Oppdatert ${hhmm(Date.now())}`);
    // linjekode(r) fra avgangene, f.eks. "18-538"
    const codes = new Set([...board.L.values(), ...board.R.values()].map(d => d.code).filter(Boolean));
    setTitle([...codes].sort());
  } catch { setStatus("Noe feilet ved henting"); }
  board.updateNowButton();
  updateFerry(board);
  setInterval(() => updateFerry(board), 1000);

  setInterval(async () => {
    try {
      await board.refresh();
      setStatus(`Oppdatert ${hhmm(Date.now())}`);
    } catch (e) { setStatus(`Feil ved oppdatering: ${e.message}`); }
  }, REFRESH_MS);

  // Hvis siden har vært i bakgrunnen en stund: oppdater når den blir synlig igjen
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) board.refresh().then(() => board.scrollToNow(false)).catch(() => {});
  });
}

main();
</script>
